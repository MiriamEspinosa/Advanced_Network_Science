name: network_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - networkx
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - jupyterlab
  - ipykernel
  - tqdm
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - torchvision
      - torchaudio
      - torch_geometric
      